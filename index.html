<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eleva | Vida Saudável</title>
  <link rel="stylesheet" href="assets/css/lenis.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/vendor/lenis.min.js" defer></script>
  <script src="assets/js/lenis-init.js" defer></script>
  <script src="assets/js/responsive-video.js" defer></script>
  <script src="assets/js/sound-toggle.js" defer></script>
</head>
<body>

  <section id="inicio" class="site-section">
    <video class="responsive-video" autoplay loop muted playsinline
      data-desktop="assets/videos/hero-1-monitor-bg.mp4"
      data-mobile="assets/videos/hero-1-monitor-bg-mobile.mp4">
      <source src="assets/videos/hero-1-monitor-bg.mp4" type="video/mp4" />
    </video>
  </section>

  <section class="site-section site-section--audio">
    <video class="responsive-video" autoplay loop muted playsinline id="hero2-video"
      data-desktop="assets/videos/hero-2-mulher-bg.mp4"
      data-mobile="assets/videos/hero-2-mulher-bg-mobile.mp4">
      <source src="assets/videos/hero-2-mulher-bg.mp4" type="video/mp4" />
    </video>
    <div class="video-controls">
      <button type="button" class="mic-toggle" id="hero2-sound-toggle" aria-label="Ativar som do vídeo">
        <span class="mic-toggle__label">Ative o som</span>
        <span class="mic-toggle__icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="#fff"/>
            <path d="M6 11v1a6 6 0 0 0 12 0v-1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M12 18v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="mic-toggle__dot"></span>
        </span>
      </button>
    </div>
  </section>

  <section id="sobre" class="site-section">
    <video class="responsive-video" autoplay loop muted playsinline
      data-desktop="assets/videos/sobre-eleva-bg.mp4"
      data-mobile="assets/videos/sobre-eleva-bg-mobile.mp4">
      <source src="assets/videos/sobre-eleva-bg.mp4" type="video/mp4" />
    </video>
  </section>

  <section id="produtos" class="site-section">
    <video class="responsive-video" autoplay loop muted playsinline
      data-desktop="assets/videos/produtos-bg.mp4"
      data-mobile="assets/videos/produtos-bg-mobile.mp4">
      <source src="assets/videos/produtos-bg.mp4" type="video/mp4" />
    </video>
  </section>

  <section id="clube" class="site-section">
    <video class="responsive-video" autoplay loop muted playsinline
      data-desktop="assets/videos/clube-eleva-bg.mp4"
      data-mobile="assets/videos/clube-eleva-bg-mobile.mp4">
      <source src="assets/videos/clube-eleva-bg.mp4" type="video/mp4" />
    </video>
  </section>

  <footer id="contato" class="site-section">
    <video class="responsive-video" autoplay loop muted playsinline
      data-desktop="assets/videos/footer-bg.mp4"
      data-mobile="assets/videos/footer-bg-mobile.mp4">
      <source src="assets/videos/footer-bg.mp4" type="video/mp4" />
    </video>
  </footer>

</body>
</html>
